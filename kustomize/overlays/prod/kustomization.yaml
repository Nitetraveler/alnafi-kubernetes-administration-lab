apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base

replicas:
- name: catalog
  count: 3

commonLabels:
  env: prod

configMapGenerator:
- name: catalog-settings
  namespace: shop
  literals:
  - APP_ENV=production
  - LOG_LEVEL=info

patches:
- path: priority-patch.yaml
