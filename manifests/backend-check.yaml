apiVersion: v1
kind: Pod
metadata:
  name: backend-check
  namespace: shop
spec:
  restartPolicy: Never
  containers:
  - name: curl
    image: curlimages/curl:8.10.1
    command: ["/bin/sh", "-c", "curl -fsS http://backend:5678/; sleep 30"]
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
