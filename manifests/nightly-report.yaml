apiVersion: batch/v1
kind: Job
metadata:
  name: nightly-report
  namespace: shop
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      tolerations:
      - key: dedicated
        operator: Equal
        value: batch
        effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: workload
                operator: In
                values: ["batch"]
      containers:
      - name: report
        image: busybox:1.36
        command: ["sh", "-c", "echo report generated on $NODE_NAME; sleep 5"]
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
