apiVersion: v1
kind: Pod
metadata:
  name: tester
  namespace: shop
  labels:
    app: tester
spec:
  restartPolicy: Never
  containers:
  - name: tester
    image: curlimages/curl:8.10.1
    command: ["/bin/sh", "-c", "sleep 86400"]
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
